<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <nav class="tabs">
    <button data-tab="timer" class="on">타이머</button>
    <button data-tab="stopwatch">스탑워치</button>
    <button data-tab="clock">시계</button>
    <button id="openWeb" class="web" title="큰 화면으로 보기">⛶</button>
  </nav>

  <section id="timer" class="pane on">
    <div class="modes">
      <button data-mode="focus">집중</button>
      <button data-mode="break">휴식</button>
    </div>
    <div class="ring">
      <svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="52" />
        <circle class="bar" id="bar" cx="60" cy="60" r="52" />
      </svg>
      <div class="big" id="tDisplay">25:00</div>
    </div>
    <div class="controls">
      <button id="tStart" class="primary">시작</button>
      <button id="tReset">리셋</button>
    </div>
    <div class="settings">
      <div class="row" data-key="focusSec">
        <span>집중</span>
        <input data-u="3600" type="number" min="0" max="23" /> 시
        <input data-u="60" type="number" min="0" max="59" /> 분
        <input data-u="1" type="number" min="0" max="59" /> 초
      </div>
      <div class="row" data-key="breakSec">
        <span>휴식</span>
        <input data-u="3600" type="number" min="0" max="23" /> 시
        <input data-u="60" type="number" min="0" max="59" /> 분
        <input data-u="1" type="number" min="0" max="59" /> 초
      </div>
    </div>
  </section>

  <section id="stopwatch" class="pane">
    <div class="big sw" id="swDisplay">00:00.00</div>
    <div class="controls">
      <button id="swStart" class="primary">시작</button>
      <button id="swLap">랩</button>
      <button id="swReset">리셋</button>
    </div>
    <ol id="laps"></ol>
  </section>

  <section id="clock" class="pane">
    <div class="big" id="clockTime">--:--:--</div>
    <div class="date" id="clockDate"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
