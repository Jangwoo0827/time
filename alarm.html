<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>⏰ 시간 종료!</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font: 16px/1.4 system-ui, "Segoe UI", "Malgun Gothic", sans-serif; color: #fff;
      background: #e5484d; animation: flash 0.8s steps(1) infinite; user-select: none; }
    @keyframes flash { 50% { background: #ff8a00; } }
    .clock { width: 120px; height: 120px; animation: shake 1s infinite; transform-origin: 50% 60%; }
    @keyframes shake {
      0%, 60%, 100% { transform: rotate(0); }
      5%, 15%, 25%, 35%, 45% { transform: rotate(-20deg); }
      10%, 20%, 30%, 40%, 50% { transform: rotate(20deg); }
    }
    h1 { margin: 0; font-size: 30px; }
    p { margin: 0; font-size: 17px; opacity: 0.95; text-align: center; padding: 0 16px; }
    .btns { display: flex; gap: 10px; margin-top: 8px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; }
    #next { background: #fff; color: #e5484d; }
    #off { background: rgba(0, 0, 0, 0.25); color: #fff; }
  </style>
</head>
<body>
  <svg class="clock" viewBox="0 0 32 32">
    <g stroke="#1c1c1f" stroke-width="2.4" stroke-linecap="round">
      <line x1="9" y1="26" x2="6" y2="30" /><line x1="23" y1="26" x2="26" y2="30" />
    </g>
    <path d="M3 9 a5 5 0 0 1 10 0z M19 9 a5 5 0 0 1 10 0z" fill="#fff" />
    <circle cx="16" cy="18" r="11" fill="#fff" />
    <circle cx="16" cy="18" r="8" fill="#fff" stroke="#1c1c1f" stroke-width="1" />
    <g stroke="#1c1c1f" stroke-width="2" stroke-linecap="round">
      <line x1="16" y1="18" x2="16" y2="12.5" /><line x1="16" y1="18" x2="20" y2="18" />
    </g>
  </svg>
  <h1 id="title">시간 종료!</h1>
  <p id="msg"></p>
  <div class="btns">
    <button id="next">바로 시작</button>
    <button id="off">끄기</button>
  </div>
  <script src="alarm.js"></script>
</body>
</html>
